confidence_threshold: 0.25
timeout_seconds: 20
batch_size: 4
tensorrt_enabled: false
request_headers:
  X-Source-System: muye

# 多模型配置（可选）
# 切换模型：POST /models/switch {"model_name": "yolov8s"}
models:
  yolov8n:
    path: models/best.pt
    device: auto
    description: "YOLOv8 默认模型"
active_model: yolov8n

local_api:
  host: 127.0.0.1
  port: 8010
  model_path: models/best.pt
  device: auto
  max_batch_size: 4
