# Competition demo profile for /etc/nginx/sites-available/muye
# Use plain HTTP on the local network to reduce现场依赖 and certificate risk.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream muye_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Adjust this path if the frontend dist is deployed elsewhere.
    root /var/www/muye/frontend/dist;
    index index.html;
    client_max_body_size 20m;

    # Long-term cache for content-hashed Vite assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Keep the HTML shell fresh so new deploys can point to new hashed assets.
    location = /index.html {
        try_files $uri =404;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Optional lightweight health probe for the operator.
    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://muye_backend/health;
    }

    # API + WebSocket reverse proxy.
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_pass http://muye_backend;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
