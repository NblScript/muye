# Muye local integration stack
#
# 一键启动：
#   先准备真实模型 models/best.pt
#   docker compose up --build
#
# 访问地址：
#   - Frontend:     http://localhost:5173
#   - Backend API:  http://localhost:18000
#
# 注意：
#   - AI 决策与天气使用 mock，昆虫识别使用真实本地 YOLO 模型
#   - 无人机使用固定的 animated_demo 后端，不会连接或控制真机
#
services:
  # ==================
  # Backend Service
  # ==================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "127.0.0.1:${MUYE_COMPOSE_API_PORT:-18000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./models:/app/models:ro
    environment:
      MUYE_API_PORT: "8000"
      MUYE_SQLITE_PATH: /app/data/muye.db
      MUYE_PIPELINE_READY_FILE: /app/data/runtime/pipeline.ready
      MUYE_ENABLE_SQLITE_DECISION_CONTEXT: "false"
      YOLO_API_URL: http://127.0.0.1:8010/detect
      YOLO_LOCAL_MODEL_PATH: /app/models/best.pt
      QWEN_USE_MOCK: "true"
      QWEATHER_USE_MOCK: "true"
      RAG_ENABLED: "false"
      MUYE_MULTI_AGENT_ENABLED: "false"
      MUYE_ROUTER_ENABLED: "false"
      DRONE_BACKEND: px4
      PX4_EXECUTION_MODE: animated_demo
      PX4_AUTO_START_ON_SPRAY: "false"
      PX4_ALLOW_FORCE_ARM: "false"
      PX4_REQUIRE_GLOBAL_POSITION: "false"
      MUYE_TAKEOFF_MODE: manual
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  # ==================
  # Frontend Service
  # ==================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:${MUYE_COMPOSE_FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
